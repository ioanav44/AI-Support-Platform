services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pulseai_postgres
    environment:
      POSTGRES_DB: pulseai_db
      POSTGRES_USER: pulseai_admin
      POSTGRES_PASSWORD: pulseai_secret_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulseai_admin -d pulseai_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pulseai_network

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: pulseai_ml_service
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: pulseai_db
      DB_USER: pulseai_admin
      DB_PASSWORD: pulseai_secret_pass
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pulseai_network

  server:
    build:
      context: ./server-java
      dockerfile: Dockerfile
    container_name: pulseai_server
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: pulseai_db
      DB_USER: pulseai_admin
      DB_PASSWORD: pulseai_secret_pass
      SERVER_PORT: 8080
      JWT_SECRET: 9Mjkl@pQrStU2VwXyZa1bCdEfGhIjKlMnOpQrStUvWxYz3AbCdEfGhIjKlMnOpQrStUvWxYz
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      ML_SERVICE_URL: http://ml-service:8000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/auth/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pulseai_network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: pulseai_client
    ports:
      - "5173:5173"
    depends_on:
      - server
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8080
    command: npm run dev -- --host 0.0.0.0
    networks:
      - pulseai_network

volumes:
  pgdata:

networks:
  pulseai_network:
    driver: bridge
