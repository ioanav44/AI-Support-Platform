name: CI - Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: pulseai_test_db
          POSTGRES_USER: pulseai_admin
          POSTGRES_PASSWORD: pulseai_secret_pass
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'eclipse-temurin'
        cache: maven
    
    - name: Build backend
      run: |
        cd server-java
        mvn clean package -DskipTests
    
    - name: Run tests
      run: |
        cd server-java
        mvn test

  build-ml-service:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        cd ml-service
        pip install -r requirements.txt
    
    - name: Run tests
      run: |
        cd ml-service
        pytest tests/ -v

  build-frontend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: client/package-lock.json
    
    - name: Install dependencies
      run: |
        cd client
        npm ci
    
    - name: Build
      run: |
        cd client
        npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [build-backend, build-ml-service, build-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
      if: secrets.DOCKER_USERNAME != ''
    
    - name: Build backend image
      uses: docker/build-push-action@v4
      with:
        context: ./server-java
        push: false
        tags: pulseai-server:latest
    
    - name: Build ML service image
      uses: docker/build-push-action@v4
      with:
        context: ./ml-service
        push: false
        tags: pulseai-ml:latest
