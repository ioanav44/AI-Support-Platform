spring:
  application:
    name: pulseai-server
  
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    show-sql: false
    open-in-view: false
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pulseai_db}
    username: ${DB_USER:pulseai_admin}
    password: ${DB_PASSWORD:pulseai_secret_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  security:
    user:
      name: admin
      password: ${ADMIN_PASSWORD:admin}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    com.pulseai: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

jwt:
  secret: ${JWT_SECRET:9Mjkl@pQrStU2VwXyZa1bCdEfGhIjKlMnOpQrStUvWxYz3AbCdEfGhIjKlMnOpQrStUvWxYz}
  expiration:
    access-token: 900000      # 15 min
    refresh-token: 604800000  # 7 days
  
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: '*'
    allow-credentials: true

ml:
  service:
    url: ${ML_SERVICE_URL:http://localhost:8000}

llm:
  api:
    key: ${LLM_API_KEY:}
    endpoint: ${LLM_API_ENDPOINT:https://api.openai.com/v1}
  model: ${LLM_MODEL:gpt-3.5-turbo}
